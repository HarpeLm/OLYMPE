# Taxonomie des intents pour le dispatcheur NLU léger
# Source de vérité pour le dataset d'entraînement et le routing
#
# v1.3 — intègre les phrases réelles musique + calendrier + diverses
# Règle de normalisation : date absente = aujourd'hui (appliquée par
# l'orchestrateur et apprise par le modèle via l'étiquetage)

version: "1.4"

# Intent déterministes : traités directement par l'orchestrateur Python
# sans réveiller le LLM principal
deterministic_intents:

  # === MUSIQUE ===
  - name: play_music
    description: "Jouer de la musique"
    slots:
      - name: artist
        type: string
        required: false
      - name: title
        type: string
        required: false
      - name: album
        type: string
        required: false
      - name: playlist
        type: string
        required: false
      - name: genre
        type: string
        required: false
    handler: "integrations/music.py::play"

  - name: pause_music
    description: "Mettre en pause la musique"
    slots: []
    handler: "integrations/music.py::pause"

  - name: resume_music
    description: "Reprendre la musique"
    slots: []
    handler: "integrations/music.py::resume"

  - name: next_track
    description: "Passer à la piste suivante"
    slots: []
    handler: "integrations/music.py::next"

  - name: previous_track
    description: "Revenir à la piste précédente"
    slots: []
    handler: "integrations/music.py::previous"

  - name: get_now_playing
    description: "Demander ce qui joue actuellement"
    slots: []
    handler: "integrations/music.py::now_playing"

  # Ajouté depuis les vraies phrases (v1.1)
  - name: sleep_timer
    description: "Arrêter la musique après X minutes"
    slots:
      - name: duration_minutes
        type: integer
        required: true
    handler: "integrations/music.py::sleep_timer"

  # Ajouté depuis les vraies phrases (v1.1)
  - name: repeat_track
    description: "Répéter la piste actuelle N fois"
    slots:
      - name: count
        type: integer
        required: false
    handler: "integrations/music.py::repeat"

  # === CALENDRIER ===
  - name: create_event
    description: "Créer un événement dans le calendrier"
    slots:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: time
        type: time
        required: false
      - name: end_time
        type: time
        required: false        # ajouté v1.2 ("bloquer 15h30-18h")
      - name: duration_minutes
        type: integer
        required: false
      - name: location
        type: string
        required: false
    handler: "integrations/calendar.py::create_event"

  # Ajouté depuis les vraies phrases (v1.2)
  - name: create_recurring_event
    description: "Créer un événement récurrent (anniversaire, hebdo, mensuel)"
    slots:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        required: true
      - name: recurrence
        type: enum
        values: [yearly, weekly, monthly]
        required: true
    handler: "integrations/calendar.py::create_recurring"

  - name: get_next_event
    description: "Demander le prochain événement"
    slots: []
    handler: "integrations/calendar.py::next_event"

  - name: get_events_today
    description: "Lister les événements du jour"
    slots: []
    handler: "integrations/calendar.py::events_today"

  - name: get_events_date
    description: "Lister les événements d'une date donnée"
    slots:
      - name: date
        type: date
        required: true
    handler: "integrations/calendar.py::events_date"

  # Ajouté depuis les vraies phrases (v1.2)
  - name: check_availability
    description: "Vérifier si libre à une date/heure donnée"
    slots:
      - name: date
        type: date
        required: true
      - name: time
        type: time
        required: false
      - name: duration_minutes
        type: integer
        required: false
    handler: "integrations/calendar.py::check_availability"

  # Ajouté depuis les vraies phrases (v1.2)
  - name: search_events
    description: "Chercher un événement par mots-clés dans le titre"
    slots:
      - name: query
        type: string
        required: true
    handler: "integrations/calendar.py::search"

  # === RECHERCHE FICHIERS LOCAUX ===
  - name: find_file
    description: "Trouver un fichier par nom ou métadonnée"
    slots:
      - name: filename
        type: string
        required: false
      - name: extension
        type: string
        required: false
      - name: modified_recently
        type: boolean
        required: false
      - name: folder
        type: string
        required: false
    handler: "integrations/finder.py::search_file"

  - name: search_content
    description: "Chercher dans le contenu des fichiers"
    slots:
      - name: query
        type: string
        required: true
      - name: file_type
        type: string
        required: false
      - name: folder
        type: string
        required: false
    handler: "integrations/finder.py::search_content"

  - name: open_file
    description: "Ouvrir un fichier avec l'application par défaut"
    slots:
      - name: filename
        type: string
        required: true
    handler: "integrations/finder.py::open_file"

  # Ajouté depuis les vraies phrases (v1.3) : dossier, pas fichier
  - name: open_folder
    description: "Ouvrir un dossier dans le Finder"
    slots:
      - name: folder_name
        type: string
        required: true
    handler: "integrations/finder.py::open_folder"

  - name: list_recent_files
    description: "Lister les fichiers récents"
    slots:
      - name: hours
        type: integer
        required: false
    handler: "integrations/finder.py::list_recent_files"

  # Palier 8 Étape 5 — DESTRUCTIVE, confirmation vocale obligatoire
  - name: delete_file
    description: "Déplacer un fichier vers la corbeille (jamais de suppression définitive)"
    slots:
      - name: filename
        type: string
        required: true
    handler: "integrations/finder.py::delete_file"

  - name: empty_trash
    description: "Vider la corbeille (confirmation vocale obligatoire)"
    slots: []
    handler: "integrations/finder.py::empty_trash"

  - name: locate_file
    description: "Révéler un fichier dans le Finder sans l'ouvrir (open -R)"
    slots:
      - name: filename
        type: string
        required: true
    handler: "integrations/finder.py::locate_file"

  - name: close_file
    description: "Fermer un document ouvert dans son application (boîtes natives préservées)"
    slots:
      - name: filename
        type: string
        required: true
    handler: "integrations/finder.py::close_file"

  # === COMMANDES SYSTÈME MACOS ===
  - name: open_app
    description: "Ouvrir une application"
    slots:
      - name: app_name
        type: string
        required: true
    handler: "integrations/macos.py::open_app"

  - name: close_app
    description: "Fermer une application"
    slots:
      - name: app_name
        type: string
        required: true
    handler: "integrations/macos.py::close_app"

  # Modifié depuis les vraies phrases (v1.1) : level OU direction
  - name: set_volume
    description: "Régler le volume (absolu ou relatif d'un cran)"
    slots:
      - name: level
        type: integer
        required: false
      - name: direction
        type: enum
        values: [up, down]
        required: false
    handler: "integrations/macos.py::set_volume"

  # Modifié depuis les vraies phrases (v1.3) : level OU direction
  - name: set_brightness
    description: "Régler la luminosité (absolu ou relatif d'un cran)"
    slots:
      - name: level
        type: integer
        required: false
      - name: direction
        type: enum
        values: [up, down]
        required: false
    handler: "integrations/macos.py::set_brightness"

  - name: take_screenshot
    description: "Faire une capture d'écran"
    slots:
      - name: region
        type: string
        required: false
    handler: "integrations/macos.py::screenshot"

  - name: sleep_mac
    description: "Mettre le Mac en veille"
    slots: []
    handler: "integrations/macos.py::sleep"

  - name: toggle_wifi
    description: "Activer ou désactiver le WiFi"
    slots:
      - name: state
        type: enum
        values: [on, off]
        required: true
    handler: "integrations/macos.py::wifi"

  - name: toggle_bluetooth
    description: "Activer ou désactiver le Bluetooth"
    slots:
      - name: state
        type: enum
        values: [on, off]
        required: true
    handler: "integrations/macos.py::bluetooth"

  - name: run_shortcut
    description: "Exécuter un raccourci macOS"
    slots:
      - name: shortcut_name
        type: string
        required: true
    handler: "integrations/macos.py::shortcut"

  # === INFO EXTERNE ===
  # Ajouté depuis les vraies phrases (v1.3)
  - name: get_weather
    description: "Demander la météo pour un lieu"
    slots:
      - name: location
        type: string
        required: true
      - name: date
        type: date
        required: false
    handler: "integrations/weather.py::get"

  # Ajouté depuis les vraies phrases (v1.3)
  # EXCEPTION CONSCIENTE (roadmap §9) : réintroduit une dépendance externe.
  # À tracer dans DECISIONS.md comme exception acceptée, pas par défaut.
  - name: web_search
    description: "Chercher sur internet"
    slots:
      - name: query
        type: string
        required: true
    handler: "integrations/web.py::search"

  # Ajouté depuis les vraies phrases (v1.4)
  - name: get_wifi_status
    description: "Demander si le Mac est connecté au WiFi"
    slots: []
    handler: "integrations/macos.py::wifi_status"

  # Ajouté depuis les vraies phrases (v1.4)
  - name: toggle_airdrop
    description: "Activer ou désactiver AirDrop"
    slots:
      - name: state
        type: enum
        values: [on, off]
        required: true
    handler: "integrations/macos.py::airdrop"

# Intent génératifs : déclenchent un fallback vers le LLM principal
generative_fallbacks:
  - name: general_question
    description: "Question générale nécessitant du raisonnement"
    trigger: "confidence < 0.75 ou intent non reconnu"
    action: "fallback to chat model"

  - name: out_of_scope
    description: "Hors périmètre ou ambigu"
    trigger: "aucun intent déterministe ne correspond"
    action: "fallback to chat model"

# Configuration du seuil de confiance
confidence:
  threshold: 0.75
  below_threshold_action: "fallback_to_generative"

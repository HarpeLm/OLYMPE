# Whitelist de ressources autorisées pour les intégrations macOS
# Toute action d'écriture/suppression passe par is_allowed() avant exécution

writable:
  - ~/MJ/data
  - ~/Desktop
  - ~/Downloads

readable:
  - ~/Documents
  - ~/Downloads
  - ~/Desktop

never_touch:
  - ~/MJ/.venv
  - ~/MJ/.git
  - /System
  - /Library
